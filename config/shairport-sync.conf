general = {
  name = "Sonoma TV";
  port = 5001;
  udp_port_base = 6001;
  udp_port_range = 100;
  mdns_backend = "avahi";
  output_backend = "alsa";
  interpolation = "basic"; // Giảm tải CPU: không dùng soxr DSP nặng gây giật tiếng trên ARM A53
  drift_tolerance_in_seconds = 0.008; // Nâng từ 0.003s lên 0.008s: tránh liên tục can thiệp mẫu âm thanh gây nghẽn CPU
  resync_threshold_in_seconds = 0.500; // Nâng từ 0.050s lên 0.500s: chống xả buffer gây rớt tiếng khi Wi-Fi biến động
  playback_mode = "stereo";
};
alsa = {
  output_device = "plughw:0,6";
  disable_standby_mode = "always"; // Giữ DAC luôn mở, chống nấc cục và mất tiếng
  audio_backend_buffer_desired_length_in_seconds = 0.35; // Tăng buffer chống rớt gói Wi-Fi
  audio_backend_buffer_interpolation_threshold_in_seconds = 0.20;
  audio_backend_latency_offset_in_seconds = 0.0;
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000; // Timeout 5s chống treo/deadlock khi ghi ảnh bìa lớn qua FIFO
};
